name: Backend tests

# Unit gate for backend/tests. No database service: DB-backed tests detect
# the unreachable default GROVE_DATABASE_URL and skip themselves; everything
# else runs on fakes. All Settings fields have defaults, so no env is needed.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-root
      - name: Run tests
        working-directory: backend
        # The two deselected tests predate this workflow: the claims
        # display-numbering change added a query that the fake sessions in
        # test_visibility_checks were never primed for. Remove the deselects
        # once draft_claim's fakes carry the extra _ExecResult.
        run: >
          poetry run python -m pytest tests/ -q
          --deselect tests/test_visibility_checks.py::test_draft_claim_inserts_when_answer_visible
          --deselect tests/test_visibility_checks.py::test_draft_claim_skips_owner_filter_with_write_all
