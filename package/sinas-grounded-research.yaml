apiVersion: sinas.co/v1
kind: SinasPackage
metadata:
  name: sinas-grounded-research
  description: >
    Multi-agent document indexing and retrieval. Installs the SGR connector,
    document ingestion collection, post-upload function, and the 13 SGR
    agents (ingestion, retrieval, synthesis).

package:
  name: sinas-grounded-research
  version: "0.1.45"
  description: >
    Sinas Grounded Research — stateful, multi-agent document indexing and retrieval. The
    runtime is generic; domain knowledge (document classes, properties,
    entity/relationship types, dossiers, playbooks) is configured in the SGR
    backend and discovered by agents at runtime via the connector.
  author: Sinas Grounded Research contributors
  url: https://github.com/sinas-platform/sinas-grounded-research

spec:
  # ─────────────────────────────────────────────
  # Function-runtime Python dependencies — installed by Sinas on worker
  # rebuild. The post-upload function uses MarkItDown to convert arbitrary
  # uploads (docx, pdf, html, xlsx, pptx, …) to markdown.
  # ─────────────────────────────────────────────
  dependencies:
    # `[all]` extra pulls in pdfminer, python-docx, openpyxl, python-pptx,
    # mammoth, etc. — needed for the converters to handle PDF/Office formats.
    - packageName: markitdown[all]
      version: ">=0.0.1a3"

  # ─────────────────────────────────────────────
  # Install-time variables — prompted for by the package installer
  # ─────────────────────────────────────────────
  variables:
    - name: SGR_URL
      type: text
      description: >
        Base URL where SGR's HTTP API is reachable from inside the Sinas
        containers. For local docker-compose this is http://host.docker.internal:8080.
        For deployed environments, the public/internal URL of the SGR service.
      example: https://sgr.example.com
      required: true

    - name: SEARCH_LLM
      type: resource_ref
      resource: llm_providers
      description: >
        Provider for the search/orchestration tier - search orchestrator,
        deep search, discovery, relationship discovery, remediation. Needs a
        strong reasoning model (e.g. Claude Sonnet).
      required: true

    - name: SYNTHESIS_LLM
      type: resource_ref
      resource: llm_providers
      description: >
        Provider for the synthesis agent - the memo writer. Split from the
        search tier so the writing model can differ (e.g. Gemini for
        language quality) without touching retrieval.
      required: true

    - name: SEARCH_MODEL
      type: string
      description: >
        Model id for the search tier, on the SEARCH_LLM provider
        (e.g. claude-sonnet-5, gemini-3.6-flash). Required - set it to the
        provider's intended model explicitly.
      required: true

    - name: SYNTHESIS_MODEL
      type: string
      description: >
        Model id for the synthesis agent (the memo writer), on the
        SYNTHESIS_LLM provider.
      required: true

    - name: VERDICT_MODEL
      type: string
      description: >
        Model id for the two publish-gate judgments - the answer gate and
        the final evidence sweep - on the SYNTHESIS_LLM provider. Held as
        its own knob so the verdict tier can run a stronger model than the
        memo writer: the approved Gate 2 configuration sets this to
        claude-opus-5 while SYNTHESIS_MODEL stays on the standard tier.
      required: true

    - name: EXTRACTION_LLM
      type: resource_ref
      resource: llm_providers
      description: >
        Provider for the extract pass (doc-metadata agent: classification,
        summary, properties, entity mentions / NER). The candidate role for
        a non-Claude model (e.g. Gemini Flash) - benchmark before switching.
      required: true

    - name: EXTRACTION_MODEL
      type: string
      description: >
        Model id for the extract pass, on the EXTRACTION_LLM provider.
      required: true

    - name: INGESTION_LLM
      type: resource_ref
      resource: llm_providers
      description: >
        Provider for the remaining one-shot ingestion passes - grounding,
        entity resolution, relationship extraction, dossier assignment.
        These calls never re-read a prompt prefix; the agents disable
        prompt caching per-agent via providerOverrides, so any provider
        works - the shared vendor provider included.
      required: true

    - name: INGESTION_MODEL
      type: string
      description: >
        Model id for the one-shot ingestion passes, on the INGESTION_LLM
        provider.
      required: true

    - name: VALIDATION_LLM
      type: resource_ref
      resource: llm_providers
      description: >
        Provider for the cycle-internal evidence checks. High cache-read
        rates measured here: leave prompt caching enabled (the provider
        default). With models set per agent, this can be the same provider
        as SEARCH_LLM/SYNTHESIS_LLM - two providers per deployment (one
        per vendor) is the intended shape.
      required: true

    - name: VALIDATION_MODEL
      type: string
      description: >
        Model id for the cycle-internal evidence checks, on the
        VALIDATION_LLM provider (e.g. claude-haiku-4-5).
      required: true

  # SGR is the system of record: no Sinas collection, no post-upload
  # function. Every route registers via SGR's own API (content-hash +
  # source identity dedup); the old collection path keyed identity on
  # collection_file_id and bypassed both.

  # ─────────────────────────────────────────────
  # Roles — the least-privilege surface for people using SGR
  #
  # A package defines roles; it never binds them to anyone. Assigning a
  # person to a role stays an operator act, so no emailDomain here.
  #
  # Two halves to each role. The `sinas.agents/sgr/*` keys let the holder
  # reach the agents this package installs — without them the first call
  # of any run 403s. The `sgr.*` keys are SGR's own permission vocabulary,
  # which its API checks back through Sinas; they are not `sinas.<resource>/`
  # keys, so an installer counts them as reaching outside the package and
  # asks the operator to consent (allowBroadRolePermissions).
  #
  # The corpus is shared; research is not. A question a lawyer asks — and
  # the sources it returned — discloses the matter they are working on, so
  # results, answers and dossiers are `:own`. Only the document corpus is
  # read:all. Admin retains :all for support; revisit if privilege rules
  # should cover operators too.
  roles:
    - name: sgr-researcher
      description: >
        Ask research questions and read the corpus, the retrieved document
        sets and the answers. Writes only their own runs and answers.
      permissions:
        - { key: "sinas.agents/sgr/*.read:all", value: true }
        - { key: "sinas.agents/sgr/*.chat:all", value: true }
        - { key: "sgr.documents.read:all", value: true }
        - { key: "sgr.results.read:own", value: true }
        - { key: "sgr.results.write:own", value: true }
        - { key: "sgr.answers.read:own", value: true }
        - { key: "sgr.answers.write:own", value: true }
        - { key: "sgr.dossiers.read:own", value: true }
        - { key: "sgr.dossiers.write:own", value: true }

    - name: sgr-curator
      description: >
        A researcher who also brings documents into the corpus and runs
        ingestion over them.
      permissions:
        - { key: "sinas.agents/sgr/*.read:all", value: true }
        - { key: "sinas.agents/sgr/*.chat:all", value: true }
        - { key: "sgr.documents.read:all", value: true }
        - { key: "sgr.documents.write:own", value: true }
        - { key: "sgr.ingestion.write:own", value: true }
        - { key: "sgr.results.read:own", value: true }
        - { key: "sgr.results.write:own", value: true }
        - { key: "sgr.answers.read:own", value: true }
        - { key: "sgr.answers.write:own", value: true }
        - { key: "sgr.dossiers.read:own", value: true }
        - { key: "sgr.dossiers.write:own", value: true }

    - name: sgr-admin
      description: >
        Configures the corpus itself — document classes, entity and
        relationship types, playbooks, packages — and may correct any
        document or answer, not only their own.
      permissions:
        - { key: "sinas.agents/sgr/*.read:all", value: true }
        - { key: "sinas.agents/sgr/*.chat:all", value: true }
        - { key: "sgr.admin:all", value: true }
        - { key: "sgr.documents.read:all", value: true }
        - { key: "sgr.documents.write:all", value: true }
        - { key: "sgr.ingestion.write:own", value: true }
        - { key: "sgr.results.read:all", value: true }
        - { key: "sgr.results.write:own", value: true }
        - { key: "sgr.answers.read:all", value: true }
        - { key: "sgr.answers.write:all", value: true }
        - { key: "sgr.dossiers.read:all", value: true }
        - { key: "sgr.dossiers.write:own", value: true }

    # ── Service identities (machine roles — bind to API keys, never people) ──

    - name: sgr-service
      description: >
        The SGR backend's own identity toward Sinas. Grants exactly what the
        runtime calls need — invoking the sgr/ agents and managing the sgr/
        skills — and nothing about results, answers or dossiers: SGR is the
        system of record for those and enforces access itself. The status
        endpoint's package-version check needs a non-namespaced packages
        read this role deliberately omits; on a key holding only this role
        that check degrades to its fallback rather than widening the grant.
      permissions:
        - { key: "sinas.agents/sgr/*.read:all", value: true }
        - { key: "sinas.agents/sgr/*.chat:all", value: true }
        - { key: "sinas.skills/sgr/*.read:all", value: true }
        - { key: "sinas.skills/sgr/*.write:all", value: true }

    - name: sgr-mcp
      description: >
        The MCP service's identity toward Sinas: token exchange only. The
        MCP backend authenticates its caller itself, exchanges that identity
        for Sinas tokens (POST /auth/token/exchange requires
        sinas.auth.exchange:all), and every subsequent call rides the
        caller's own token and roles. Deliberately granted nothing else — a
        service account that could read results would put every caller
        behind one identity, and research access must stay per-user.
      permissions:
        - { key: "sinas.auth.exchange:all", value: true }

  # ─────────────────────────────────────────────
  # Connector — wraps the SGR HTTP API
  # ─────────────────────────────────────────────
  connectors:
    - namespace: sgr
      name: api
      description: >
        HTTP API of the Sinas Grounded Research backend. Agents call these operations to
        introspect the domain model, read document content, and write
        ingestion / retrieval / synthesis artifacts.
      baseUrl: ${{ vars.SGR_URL }}
      # `sinas_token` forwards the calling user's Sinas token. SGR validates
      # it via Sinas's /auth/me endpoint to resolve the user's identity and
      # roles for owner/roles enforcement. No shared API key is needed.
      auth:
        type: sinas_token
      operations:
        # ── configuration introspection ──
        - name: get_document_classes
          method: GET
          path: /api/v1/config/document-classes
          description: List all document classes with descriptions and classification hints.

        - name: get_document_class_properties
          method: GET
          path: /api/v1/config/document-classes/{{ class_id }}/properties
          parameters:
            type: object
            properties:
              class_id: { type: string, format: uuid }
            required: [class_id]
          description: Get the property schema for a document class.

        - name: get_entity_types_for_class
          method: GET
          path: /api/v1/config/document-classes/{{ class_id }}/entity-types
          parameters:
            type: object
            properties:
              class_id: { type: string, format: uuid }
            required: [class_id]
          description: Entity types attached to a document class.

        - name: get_entity_types
          method: GET
          path: /api/v1/config/entity-types
          description: All entity types in the deployment.

        - name: get_relationship_definitions
          method: GET
          path: /api/v1/config/relationship-definitions
          description: All relationship definitions.

        # ── playbooks (SGR-owned) ──
        - name: list_applicable_playbooks
          method: GET
          path: /api/v1/playbooks/{{ kind }}/applicable/list
          parameters:
            type: object
            properties:
              kind: { type: string, enum: [retrieval, synthesis] }
              document_class_id: { type: string, format: uuid }
              dossier_class_id: { type: string, format: uuid }
            required: [kind]
          description: |
            List playbooks of `kind` applicable to the given scope. A playbook
            with no scope rows applies everywhere; a playbook with scope rows
            applies when at least one matches the document_class_id and/or
            dossier_class_id provided. Returns `[{id, kind, name, description}]`
            so the agent can pick which one(s) to fetch in full.

        - name: get_playbook
          method: GET
          path: /api/v1/playbooks/{{ kind }}/{{ name }}
          parameters:
            type: object
            properties:
              kind: { type: string, enum: [retrieval, synthesis] }
              name: { type: string }
            required: [kind, name]
          description: |
            Fetch a playbook's full content. Use after `list_applicable_playbooks`
            has surfaced what's available for the current scope.

        # ── candidate inspection ──
        - name: list_candidates
          method: GET
          path: /api/v1/retrieval/results/{{ result_id }}/candidates
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              limit: { type: integer, minimum: 1, maximum: 50 }
              offset: { type: integer, minimum: 0 }
              order_by:
                type: string
                description: |
                  filename | created_at | updated_at |
                  classification_confidence | property:<name>
              direction: { type: string, enum: [asc, desc] }
              include_toc: { type: boolean }
            required: [result_id]
          description: |
            Page through documents currently matching the result's persisted
            filter. ALWAYS check summaries (and optionally ToC) here BEFORE
            calling `read_document_content` — reading bodies is much more
            expensive, and the summary is usually enough to judge relevance.

            Response: `{rows, has_more, next_offset}` where each row is
            `{id, filename, summary, document_class_id,
            classification_confidence, (toc if include_toc)}`.
            If `has_more` is true, call again with `offset=next_offset`.
            Default limit is 10 — keep it small; tool result size matters.

            Sorting: `order_by=property:decision_date direction=desc` gives
            latest-first, important for citation/supersession chains.

        # ── entities: list/search globally, find docs by entity ──
        - name: list_entities
          method: GET
          path: /api/v1/entities
          parameters:
            type: object
            properties:
              entity_type_id: { type: string, format: uuid }
              q:
                type: string
                description: case-insensitive substring on canonical_form
              limit: { type: integer, minimum: 1, maximum: 500 }
          description: |
            Search entities globally. Use when the question names an entity
            (e.g. "Autorité de la concurrence") to resolve the name to one or
            more candidate `entity_id`s. Then call
            `list_documents_by_entity(entity_id)` to find documents that
            mention it, or use the entity-filter mutations to narrow the
            result's filter directly.

        - name: list_documents_by_entity
          method: GET
          path: /api/v1/entities/{{ entity_id }}/documents
          parameters:
            type: object
            properties:
              entity_id: { type: string, format: uuid }
              limit: { type: integer, minimum: 1, maximum: 100 }
              offset: { type: integer, minimum: 0 }
            required: [entity_id]
          description: |
            List documents that mention `entity_id`, with mention counts.
            Visibility-scoped. Sorted by mention_count desc. Use for the
            graph-traversal "what docs reference this thing" lookup before
            filtering or pinning.

        - name: get_entity_mentions_for_document
          method: GET
          path: /api/v1/documents/{{ doc_id }}/entity-mentions
          parameters:
            type: object
            properties:
              doc_id: { type: string, format: uuid }
            required: [doc_id]
          description: |
            List all entities mentioned in a document with their spans. Use
            when judging whether a candidate is relevant: which entities does
            it actually reference?

        # ── entity-filter mutations (server-traced) ──
        - name: set_entity_filter
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/filter/entity-filters/set
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              filter_version: { type: integer }
              entity_type_id: { type: string, format: uuid }
              entity_ids:
                type: array
                items: { type: string, format: uuid }
            required: [result_id, filter_version, entity_ids]
          description: |
            Narrow the result's candidate set to documents that mention at
            least one of `entity_ids`. `entity_type_id` is the slot key
            (omit for ungrouped); multiple slots AND together, so calling
            this twice with different entity_type_ids gives
            "mentions Authority X AND mentions Article Y".

        - name: extend_entity_filter
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/filter/entity-filters/extend
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              filter_version: { type: integer }
              entity_type_id: { type: string, format: uuid }
              entity_ids:
                type: array
                items: { type: string, format: uuid }
            required: [result_id, filter_version, entity_ids]
          description: Add entity_ids to the slot's OR list (widens within-slot).

        - name: shrink_entity_filter
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/filter/entity-filters/shrink
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              filter_version: { type: integer }
              entity_type_id: { type: string, format: uuid }
              entity_ids:
                type: array
                items: { type: string, format: uuid }
            required: [result_id, filter_version, entity_ids]
          description: Remove entity_ids from the slot's OR list.

        - name: remove_entity_filter
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/filter/entity-filters/remove
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              filter_version: { type: integer }
              entity_type_id: { type: string, format: uuid }
            required: [result_id, filter_version]
          description: Drop the entire slot.

        - name: get_dossier_classes
          method: GET
          path: /api/v1/config/dossier-classes
          description: List dossier classes (empty if dossiers not configured).

        - name: get_dossier_class_properties
          method: GET
          path: /api/v1/config/dossier-classes/{{ class_id }}/properties
          parameters:
            type: object
            properties:
              class_id: { type: string, format: uuid }
            required: [class_id]

        - name: find_candidate_dossiers
          method: GET
          path: /api/v1/dossiers
          parameters:
            type: object
            properties:
              dossier_class_id: { type: string, format: uuid }

        # ── content access ──
        - name: get_document
          method: GET
          path: /api/v1/documents/{{ doc_id }}
          parameters:
            type: object
            properties:
              doc_id: { type: string, format: uuid }
            required: [doc_id]
          description: |
            Document metadata. `toc` holds the document's table of contents
            as {entries: [{title, level, line, line_to}]} — verbatim section
            headings with their line ranges (empty when the document has no
            heading structure). Use it to jump straight to the relevant
            section with read_document_content's line_from/line_to.

        - name: read_document_content
          method: GET
          path: /api/v1/documents/{{ doc_id }}/versions/{{ version }}/content
          requestBodyMapping: query
          parameters:
            type: object
            properties:
              doc_id: { type: string, format: uuid }
              version: { type: integer }
              line_from: { type: integer, minimum: 1 }
              line_to: { type: integer, minimum: 1 }
              numbered: { type: boolean, description: "Prefix every line with its absolute line number. ALWAYS pass true when you will cite spans: copy the visible numbers into line_from/line_to — never count lines yourself." }
            required: [doc_id, version]
          description: |
            Read document content. Returns at most ~500 lines per call to
            keep tool responses small. The response includes `total_lines`,
            `line_from`, `line_to`, and `next_line` — if `next_line` is
            non-null, call again with `line_from=<next_line>` to continue
            reading. A call WITHOUT line_from/line_to opens the document:
            the response starts with `toc` — the table of contents as
            {title, level, line, line_to} entries — followed by the first
            lines. For long documents, do NOT page from the top: pick the
            relevant section from the toc and read exactly its line range
            via line_from/line_to.

        - name: get_property_values
          method: GET
          path: /api/v1/documents/{{ doc_id }}/property-values
          parameters:
            type: object
            properties:
              doc_id: { type: string, format: uuid }
            required: [doc_id]

        - name: list_dossier_documents
          method: GET
          path: /api/v1/dossiers/{{ dossier_id }}/documents
          parameters:
            type: object
            properties:
              dossier_id: { type: string, format: uuid }
            required: [dossier_id]

        # ── ingestion writes ──
        - name: set_document_class
          method: POST
          path: /api/v1/ingest/documents/{{ doc_id }}/class
          parameters:
            type: object
            properties:
              doc_id: { type: string, format: uuid }
              document_class_id: { type: string, format: uuid }
              confidence: { type: number }
              reason: { type: string }
            required: [doc_id, document_class_id]

        - name: set_document_summary
          method: POST
          path: /api/v1/ingest/documents/{{ doc_id }}/summary
          parameters:
            type: object
            properties:
              doc_id: { type: string, format: uuid }
              summary: { type: string }
              toc: { type: object }
            required: [doc_id, summary]

        - name: set_property_value
          method: POST
          path: /api/v1/ingest/property-values
          parameters:
            type: object
            properties:
              property_id: { type: string, format: uuid }
              document_id: { type: string, format: uuid }
              document_version_id: { type: string, format: uuid }
              value: {}
              source_span: { type: object }
              method: { type: string, enum: [auto, manual] }
              confidence: { type: number }
              reason: { type: string }
            required: [property_id, document_id, value]

        - name: propose_new_entity
          method: POST
          path: /api/v1/ingest/entities
          parameters:
            type: object
            properties:
              entity_type_id: { type: string, format: uuid }
              canonical_form: { type: string }
              extra_metadata: { type: object }
              # Evidence — required when the EntityType is `closed` so the
              # mention can be parked as an unresolved mention; useful for
              # `review` mode to give reviewers context.
              document_id: { type: string, format: uuid }
              document_version_id: { type: string, format: uuid }
              span: { type: object }
              confidence: { type: number }
              proposing_agent: { type: string }
              reasoning: { type: string }
            required: [entity_type_id, canonical_form]
          description: |
            Find-or-create. Tries alias/canonical match first; on no match,
            the EntityType's `creation_mode` decides what happens. The
            response is `{kind, id, canonical_form, creation_mode}`:
              - kind="entity"     → matched or open-mode insert. Use this id
                                    with `record_entity_mention`.
              - kind="proposal"   → review-mode: held for approval. DO NOT
                                    call `record_entity_mention` (the id is a
                                    proposal id, not an entity id).
              - kind="unresolved" → closed-mode: mention has been parked. DO
                                    NOT call `record_entity_mention`.
              - kind="blocked"    → closed-mode without evidence. Always pass
                                    document_id + span so this never happens.

        - name: record_entity_mention
          method: POST
          path: /api/v1/ingest/entity-mentions
          parameters:
            type: object
            properties:
              document_id: { type: string, format: uuid }
              document_version_id: { type: string, format: uuid }
              entity_id: { type: string, format: uuid }
              span: { type: object }
              confidence: { type: number }
            required: [document_id, entity_id, span]

        - name: find_entity_by_name
          method: POST
          path: /api/v1/ingest/find-entity
          parameters:
            type: object
            properties:
              name: { type: string }
              document_id: { type: string, format: uuid }
            required: [name, document_id]
          description: |
            Resolve an entity name to entity IDs among the entities already
            mentioned in this document. Returns a list of
            {entity_id, canonical_form, mention_id, confidence}. Use the
            entity_id as source_id / target_id for record_relationship.
            Matching is partial and case-insensitive, so a short query like
            "Commission" works; pick the right match from the returned list.

        - name: record_relationship
          method: POST
          path: /api/v1/ingest/relationships
          parameters:
            type: object
            properties:
              relationship_definition_id: { type: string, format: uuid }
              source_id: { type: string, format: uuid }
              target_id: { type: string, format: uuid }
              current_state_id: { type: string, format: uuid }
              evidence_document_id: { type: string, format: uuid }
              evidence_span: { type: object }
              confidence: { type: number }
              notes: { type: string }
            required: [relationship_definition_id, source_id, target_id]

        - name: propose_relationship
          method: POST
          path: /api/v1/ingest/relationship-proposals
          parameters:
            type: object
            properties:
              relationship_definition_id: { type: string, format: uuid }
              source_id: { type: string, format: uuid }
              target_id: { type: string, format: uuid }
              suggested_state_id: { type: string, format: uuid }
              proposing_agent: { type: string }
              reasoning: { type: string }
              evidence_document_id: { type: string, format: uuid }
              evidence_span: { type: object }
              confidence: { type: number }
            required: [relationship_definition_id, source_id, target_id]

        - name: record_unresolved_relationship
          method: POST
          path: /api/v1/ingest/unresolved-relationships
          parameters:
            type: object
            properties:
              relationship_definition_id: { type: string, format: uuid }
              source_id: { type: string, format: uuid }
              target_key: { type: string }
              target_key_kind: { type: string }
              suggested_state_id: { type: string, format: uuid }
              proposing_agent: { type: string }
              reasoning: { type: string }
              evidence_document_id: { type: string, format: uuid }
              evidence_span: { type: object }
              confidence: { type: number }
            required: [relationship_definition_id, source_id, target_key]
          description: |
            Record a relationship whose source node is known but whose target
            isn't in the graph yet — e.g. the document cites an ECLI we haven't
            ingested. Pass the raw reference as `target_key` (and `target_key_kind`,
            e.g. "ecli"). The edge is held until a resolver promotes it to a real
            relationship when the target is later ingested. Prefer this over
            dropping a cite you can't resolve.

        - name: assign_dossier
          method: POST
          path: /api/v1/dossiers/{{ dossier_id }}/documents
          parameters:
            type: object
            properties:
              dossier_id: { type: string, format: uuid }
              document_id: { type: string, format: uuid }
              role: { type: string }
            required: [dossier_id, document_id]

        - name: propose_new_dossier
          method: POST
          path: /api/v1/dossiers
          parameters:
            type: object
            properties:
              dossier_class_id: { type: string, format: uuid }
              name: { type: string }
              status: { type: string }
            required: [dossier_class_id, name]

        # ── retrieval ──
        - name: introspect
          method: POST
          path: /api/v1/retrieval/introspect
          parameters:
            type: object
            properties:
              filter: { type: object }
              fields:
                type: array
                items: { type: string }
              top_k: { type: integer }
          description: |
            Count the documents matching the filter and return faceted value
            distributions for the requested fields. `filter.text_search` uses
            web-search syntax: terms are AND-ed by default, `OR` unions terms,
            `-term` excludes, and "quoted phrases" match adjacent words —
            e.g. `"climate adaptation" OR flood -insurance`.
            With `fields` omitted, distributions cover EVERY property of the
            class — do that at most once, to learn which fields discriminate.
            On every later call pass `fields` with only the properties you
            are still deciding on: the response is smaller, faster, and you
            re-read it each turn. `top_k` (default 10) caps values per field;
            raise it only when you genuinely need the long tail.

        - name: matching_documents
          method: POST
          path: /api/v1/retrieval/matching-documents
          parameters:
            type: object
            properties:
              filter: { type: object }
              limit: { type: integer, default: 50 }
          description: |
            Enumerate the documents matching the filter — the companion to
            `introspect`, which only returns counts and value distributions.
            Same filter body as introspect, including web-search syntax in
            `filter.text_search` (AND by default, `OR`, `-term`, "quoted
            phrases"). Returns {document_ids: [...], documents: [...]} where
            each documents entry carries `id`, `filename`,
            `document_class_name`, and a `summary` preview — enough to tell
            what every match is WITHOUT calling `get_document` per id. Only
            call `get_document`/`read_document_content` on the few documents
            you actually need to inspect further. Capped by `limit` (default
            50, max 200). When the filter has a `text_search`, matches are
            ordered most-relevant first, so a truncated response keeps the
            best matches; without one the order is arbitrary (by id). Use it
            to pull the actual matches into a draft Result via
            `add_files_to_result`.

        - name: create_draft_result
          method: POST
          path: /api/v1/retrieval/results
          parameters:
            type: object
            properties:
              query: { type: string }
              invoked_skill_names:
                type: array
                items: { type: string }
              parent_result_id: { type: string, format: uuid }
            required: [query]

        - name: add_files_to_result
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/files
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              document_ids:
                type: array
                items: { type: string, format: uuid }
              reason: { type: string }
              added_by_agent: { type: string }
            required: [result_id, document_ids]
          description: Add documents to the draft result. Pair with a reason; the agent's prior `append_trace` or its own narrative is the audit trail.

        - name: remove_files_from_result
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/files/remove
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              document_ids:
                type: array
                items: { type: string, format: uuid }
              reason: { type: string }
            required: [result_id, document_ids]
          description: Remove specific documents from the draft result. Server auto-traces.

        - name: clear_result_files
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/files/clear
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
            required: [result_id]
          description: Drop all documents from the draft result. Rare — used when restarting the selection.

        # ── filter mutations on the draft Result ──
        # All filter ops carry filter_version (optimistic concurrency); the
        # server auto-writes a result_trace row with before/after state and
        # candidate-count delta. The agent does NOT need to call append_trace
        # for these mutations — only for narrative entries (reasoning).

        - name: introspect_by_result
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/introspect
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              fields:
                type: array
                items: { type: string }
              top_k: { type: integer, default: 10 }
              overlay:
                type: object
                description: Optional ephemeral filter overlay for what-if probes; not persisted.
            required: [result_id]
          description: Run introspect against the persisted filter on this result. Preferred over the stateless `/introspect` once a draft Result exists — the filter is not re-emitted on the wire.

        - name: set_document_class_filter
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/filter/document-class/set
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              filter_version: { type: integer }
              document_class_id: { type: string, format: uuid }
            required: [result_id, filter_version, document_class_id]
          description: Scope this result to one DocumentClass.

        - name: clear_document_class_filter
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/filter/document-class/clear
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              filter_version: { type: integer }
            required: [result_id, filter_version]
          description: Remove the document-class scope.

        - name: set_dossier_filter
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/filter/dossier/set
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              filter_version: { type: integer }
              dossier_id: { type: string, format: uuid }
            required: [result_id, filter_version, dossier_id]
          description: Scope this result to one specific Dossier.

        - name: set_dossier_class_filter
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/filter/dossier-class/set
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              filter_version: { type: integer }
              dossier_class_id: { type: string, format: uuid }
            required: [result_id, filter_version, dossier_class_id]
          description: Scope this result to docs inside dossiers of this class.

        - name: clear_dossier_filters
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/filter/dossier/clear
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              filter_version: { type: integer }
            required: [result_id, filter_version]
          description: Clear both dossier_id and dossier_class_id.

        - name: set_field_filter
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/filter/field-filters/{{ field }}/set
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              field: { type: string }
              filter_version: { type: integer }
              op:
                type: string
                enum: [eq, in, gte, lte, gt, lt, neq]
                default: in
              values:
                type: array
              value: {}
              join:
                type: string
                enum: [and, or]
                default: and
            required: [result_id, field, filter_version, op]
          description: Upsert a property field filter. Replaces any existing filter on the same field.

        - name: extend_field_filter_values
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/filter/field-filters/{{ field }}/extend
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              field: { type: string }
              filter_version: { type: integer }
              values:
                type: array
            required: [result_id, field, filter_version, values]
          description: Append values to an existing field filter (op must be `in` or `neq`). Auto-creates with op=in if absent.

        - name: shrink_field_filter_values
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/filter/field-filters/{{ field }}/shrink
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              field: { type: string }
              filter_version: { type: integer }
              values:
                type: array
            required: [result_id, field, filter_version, values]
          description: Remove specific values from a field filter. Drops the filter entirely if the values list becomes empty.

        - name: remove_field_filter
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/filter/field-filters/{{ field }}/remove
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              field: { type: string }
              filter_version: { type: integer }
            required: [result_id, field, filter_version]
          description: Drop the field filter for this field.

        - name: set_regex_filter
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/filter/regex-filters/{{ field }}/set
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              field: { type: string }
              filter_version: { type: integer }
              pattern: { type: string }
            required: [result_id, field, filter_version, pattern]
          description: Upsert a regex filter on a property field.

        - name: remove_regex_filter
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/filter/regex-filters/{{ field }}/remove
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              field: { type: string }
              filter_version: { type: integer }
            required: [result_id, field, filter_version]
          description: Drop the regex filter for this field.

        - name: set_text_search
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/filter/text-search/set
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              filter_version: { type: integer }
              query: { type: string }
            required: [result_id, filter_version, query]
          description: |
            Set the full-text-search query on this filter. The query uses
            web-search syntax: terms are AND-ed by default, `OR` unions
            terms, `-term` excludes, and "quoted phrases" match adjacent
            words — e.g. `"supply chain" OR logistics -aviation`.

        - name: clear_text_search
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/filter/text-search/clear
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              filter_version: { type: integer }
            required: [result_id, filter_version]
          description: Clear the full-text-search query.

        - name: add_explicit_includes
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/filter/includes/add
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              filter_version: { type: integer }
              document_ids:
                type: array
                items: { type: string, format: uuid }
            required: [result_id, filter_version, document_ids]
          description: Pin specific documents as forced-includes regardless of other filter clauses.

        - name: remove_explicit_includes
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/filter/includes/remove
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              filter_version: { type: integer }
              document_ids:
                type: array
                items: { type: string, format: uuid }
            required: [result_id, filter_version, document_ids]
          description: Unpin specific documents from the explicit-includes list.

        - name: clear_explicit_includes
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/filter/includes/clear
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              filter_version: { type: integer }
            required: [result_id, filter_version]
          description: Clear all explicit includes.

        - name: add_explicit_excludes
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/filter/excludes/add
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              filter_version: { type: integer }
              document_ids:
                type: array
                items: { type: string, format: uuid }
            required: [result_id, filter_version, document_ids]
          description: Block specific documents from the candidate set.

        - name: remove_explicit_excludes
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/filter/excludes/remove
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              filter_version: { type: integer }
              document_ids:
                type: array
                items: { type: string, format: uuid }
            required: [result_id, filter_version, document_ids]
          description: Unblock specific documents from the explicit-excludes list.

        - name: clear_explicit_excludes
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/filter/excludes/clear
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              filter_version: { type: integer }
            required: [result_id, filter_version]
          description: Clear all explicit excludes.

        - name: clear_filter
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/filter/clear
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              filter_version: { type: integer }
            required: [result_id, filter_version]
          description: Reset the entire filter on this result to empty defaults.

        - name: replace_filter
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/filter/replace
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              filter_version: { type: integer }
              filter: { type: object }
            required: [result_id, filter_version, filter]
          description: Total override of the filter. Escape hatch — prefer specific mutations when possible.

        - name: append_trace
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/trace
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              sequence: { type: integer }
              agent: { type: string }
              action: { type: string }
              parameters: { type: object }
              outcome: { type: object }
            required: [result_id, sequence, agent, action]

        - name: publish_result
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/publish
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
            required: [result_id]

        - name: expand_result_graph
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/expand
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              steps:
                type: array
                items:
                  type: object
                  properties:
                    relationship: { type: string }
                    direction: { type: string, enum: [out, in] }
                  required: [relationship, direction]
            required: [result_id, steps]
          description: |
            Deterministically expand the result along a path of relationship
            edges YOU declare. Starting from the attached documents, each
            step follows edges of the named relationship definition (out:
            source→target, in: target→source); documents in the final
            frontier are attached with per-origin provenance and one trace.
            Read `get_relationship_definitions` (and your playbook) to know
            which edges exist and what path expresses the expansion you
            want, then make ONE call — never traverse `get_relationships`
            hop by hop. Example: citations to full texts is
            steps=[{relationship: "cites", direction: "out"},
                   {relationship: "is_full_text_of", direction: "in"}].

        - name: merge_results
          method: POST
          path: /api/v1/retrieval/results/{{ result_id }}/merge
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
              child_result_ids:
                type: array
                items: { type: string, format: uuid }
            required: [result_id, child_result_ids]
          description: |
            Deterministically merge child results into the parent
            `result_id`: the server copies the union of the children's
            documents (dedup by document, provenance preserved), links each
            child via parent_result_id, and writes a trace recording the
            merge. Pass ONLY the child result ids — never enumerate document
            ids yourself; the server guarantees nothing is dropped.

        - name: list_results
          method: GET
          path: /api/v1/results
          parameters:
            type: object
            properties:
              limit: { type: integer, default: 20 }
          description: |
            Recent results, newest first (query, status, id). Use it to check
            whether a result for a given sub-query already exists — e.g.
            before re-dispatching a sub-search whose invocation timed out.

        - name: get_result
          method: GET
          path: /api/v1/results/{{ result_id }}
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
            required: [result_id]

        - name: order_documents
          method: POST
          path: /api/v1/annotations/order-documents
          parameters:
            type: object
            properties:
              document_ids:
                type: array
                items: { type: string, format: uuid }
              group_by: { type: string }
              precedence:
                type: array
                items: { type: string }
              then_by:
                type: array
                items:
                  type: object
                  properties:
                    by: { type: string }
                    direction: { type: string, enum: [asc, desc] }
              names:
                type: array
                items: { type: string }
            required: [document_ids]
          description: |
            Order documents by their derived authority annotations in ONE
            deterministic call. then_by [{"by": "authority_tier.depth",
            "direction": "asc"}] puts decisions of the highest authorities
            first (depth 1 = the issuer has nothing above it). Returns the
            ordered document ids plus each document's annotations
            (issuing_body, authority_tier). Documents without a case entity
            sort last.

        - name: get_result_documents
          method: GET
          path: /api/v1/results/{{ result_id }}/documents
          parameters:
            type: object
            properties:
              result_id: { type: string, format: uuid }
            required: [result_id]
          description: |
            The documents attached to a result, in rank order. Each row
            already carries `filename`, `document_class_name`, and a
            `summary` preview — enough to know what every attachment is
            WITHOUT calling `get_document` per id. Only call
            `get_document`/`read_document_content` on documents you need
            to inspect in depth.

        - name: get_relationships
          method: GET
          path: /api/v1/relationships
          parameters:
            type: object
            properties:
              relationship_definition_id: { type: string, format: uuid }
              source_id: { type: string, format: uuid }
              target_id: { type: string, format: uuid }

        - name: get_unresolved_relationships
          method: GET
          path: /api/v1/relationships/unresolved
          parameters:
            type: object
            properties:
              status_filter: { type: string }
              source_id: { type: string, format: uuid }
              target_key: { type: string }
          description: >
            List parked relationships whose target node isn't in the graph yet
            (e.g. cited ECLIs not yet ingested). Filter by status_filter
            (default "unresolved"), source_id, or target_key. The future
            resolver agent reads these to promote them once targets are ingested.

        # ── discovery (config auto-suggestion) ──
        - name: list_run_candidates
          method: GET
          path: /api/v1/discovery/runs/{{ run_id }}/candidates
          parameters:
            type: object
            properties:
              run_id: { type: string, format: uuid }
            required: [run_id]
          description: List raw discovery candidates for a run (used by the consolidator).

        - name: submit_discovery_candidate
          method: POST
          path: /api/v1/discovery/candidates
          parameters:
            type: object
            properties:
              run_id: { type: string, format: uuid }
              kind: { type: string }
              payload: { type: object }
              evidence_document_id: { type: string, format: uuid }
              evidence_span: { type: object }
              confidence: { type: number }
            required: [run_id, kind, payload]
          description: Submit a raw candidate config item discovered in a single document.

        - name: submit_consolidated_proposal
          method: POST
          path: /api/v1/discovery/proposals
          parameters:
            type: object
            properties:
              run_id: { type: string, format: uuid }
              kind: { type: string }
              payload: { type: object }
              supporting_candidate_ids:
                type: array
                items: { type: string, format: uuid }
            required: [run_id, kind, payload, supporting_candidate_ids]
          description: Submit a deduplicated proposal that folds multiple raw candidates.

        # ── synthesis ──
        - name: start_answer
          method: POST
          path: /api/v1/synthesis/answers
          parameters:
            type: object
            properties:
              question: { type: string }
              source_result_id: { type: string, format: uuid }
              source_dossier_id: { type: string, format: uuid }
            required: [question]

        - name: draft_claim
          method: POST
          path: /api/v1/synthesis/answers/{{ answer_id }}/claims
          parameters:
            type: object
            properties:
              answer_id: { type: string, format: uuid }
              sequence: { type: integer }
              claim_text: { type: string }
              claim_type: { type: string }
              evidence:
                type: array
                items:
                  type: object
                  properties:
                    document_id: { type: string, format: uuid }
                    document_version_id: { type: string, format: uuid }
                    span: { type: object }
                    stance:
                      type: string
                      enum: [supports, contradicts, qualifies]
                    relevance: { type: number }
                  required: [document_id, span]
            required: [answer_id, sequence, claim_text]
          description: |
            Draft one claim, binding its evidence in the same call: pass the
            supporting spans in `evidence` instead of calling `bind_evidence`
            once per span afterwards. Use `bind_evidence` only to add
            evidence to a claim you already drafted.

        - name: bind_evidence
          method: POST
          path: /api/v1/synthesis/claims/{{ claim_id }}/evidence
          parameters:
            type: object
            properties:
              claim_id: { type: string, format: uuid }
              document_id: { type: string, format: uuid }
              document_version_id: { type: string, format: uuid }
              span: { type: object }
              stance: { type: string, enum: [supports, contradicts, qualifies] }
              relevance: { type: number }
            required: [claim_id, document_id, span]

        - name: record_validation_verdict
          method: POST
          path: /api/v1/synthesis/evidence/{{ evidence_id }}/verdict
          parameters:
            type: object
            properties:
              evidence_id: { type: string, format: uuid }
              validated: { type: boolean }
              reasoning: { type: string }
            required: [evidence_id, validated, reasoning]

        - name: record_validation_verdicts
          method: POST
          path: /api/v1/synthesis/answers/{{ answer_id }}/verdicts
          parameters:
            type: object
            properties:
              answer_id: { type: string, format: uuid }
              verdicts:
                type: array
                items:
                  type: object
                  properties:
                    evidence_id: { type: string, format: uuid }
                    validated: { type: boolean }
                    reasoning: { type: string }
                  required: [evidence_id, validated, reasoning]
            required: [answer_id, verdicts]
          description: |
            Record verdicts for many evidence rows of one answer in a single
            call — prefer this over per-row `record_validation_verdict` once
            you have judged a batch. All-or-nothing: every evidence_id must
            belong to the answer or the whole batch is rejected.

        - name: update_claim
          method: PATCH
          path: /api/v1/synthesis/claims/{{ claim_id }}
          parameters:
            type: object
            properties:
              claim_id: { type: string, format: uuid }
              claim_text: { type: string }
              claim_type: { type: string }
            required: [claim_id, claim_text]
          description: |
            Rewrite a claim's text — the remedy when validation shows the
            claim asserts more than its spans support. Weaken the claim to
            what the evidence actually says. Bound evidence stays but is
            reset to unvalidated (verdicts were against the old text).

        - name: delete_claim
          method: DELETE
          path: /api/v1/synthesis/claims/{{ claim_id }}
          parameters:
            type: object
            properties:
              claim_id: { type: string, format: uuid }
            required: [claim_id]
          description: |
            Drop a claim and its evidence bindings — the remedy when no span
            in the corpus can support it (e.g. the figure is redacted in the
            source). Removing an unsupportable claim unblocks publishing.

        - name: validate_answer_evidence
          method: POST
          path: /api/v1/synthesis/answers/{{ answer_id }}/validate
          parameters:
            type: object
            properties:
              answer_id: { type: string, format: uuid }
              pending_only: { type: boolean, default: true }
            required: [answer_id]
          description: |
            Validate the answer's pending evidence rows in ONE call: the
            server judges every (claim, span) pair in parallel with an
            independent checker and records the verdicts. Returns
            {judged, passed, failed:[{claim_sequence, evidence_id,
            reason}], errors}. Seconds, not minutes — call it after
            drafting, act on `failed` with the two-strikes rule, then
            call it again (pending_only) until `failed` and `errors` are
            empty, and publish.

        - name: publish_answer
          method: POST
          path: /api/v1/synthesis/answers/{{ answer_id }}/publish
          parameters:
            type: object
            properties:
              answer_id: { type: string, format: uuid }
            required: [answer_id]

        # ── answer reads (let the faithfulness validator enumerate evidence) ──
        - name: get_answer_evidence
          method: GET
          path: /api/v1/answers/{{ answer_id }}/evidence
          parameters:
            type: object
            properties:
              answer_id: { type: string, format: uuid }
              pending_only: { type: boolean, default: false }
            required: [answer_id]
          description: |
            Every claim of the answer with its evidence rows nested, in one
            call — use this instead of `get_answer_claims` followed by one
            `get_claim_evidence` call per claim. Each evidence row carries
            its `id`, span, stance, and `validated` flag.
            Enumerate the FULL set once at the start; for every later
            progress re-check pass `pending_only=true` — it returns only the
            still-unvalidated rows, so the response shrinks toward empty
            instead of re-paying the full payload each round.

        - name: get_answer_claims
          method: GET
          path: /api/v1/answers/{{ answer_id }}/claims
          parameters:
            type: object
            properties:
              answer_id: { type: string, format: uuid }
            required: [answer_id]

        - name: get_claim_evidence
          method: GET
          path: /api/v1/answers/claims/{{ claim_id }}/evidence
          parameters:
            type: object
            properties:
              claim_id: { type: string, format: uuid }
            required: [claim_id]

  # Playbooks are SGR-owned (since v0.1.13). They are no longer Sinas
  # skills; the agents fetch them at runtime via `list_applicable_playbooks`
  # and `get_playbook` connector ops below. Deployments author playbooks in
  # the SGR admin UI or via a SgrPackage YAML.

  # ─────────────────────────────────────────────
  # Agents
  # ─────────────────────────────────────────────
  agents:
    # ───────── ingestion ─────────
    - namespace: sgr
      name: retrieval-planner-agent
      description: Stateless planner, drafter and reviser for the question pipeline — argument plans, extract-mode drafting, patch-based revision. Invoked by SGR's query runner; one agent, three reply shapes, so no output schema.
      llmProviderName: ${{ vars.SEARCH_LLM }}
      model: ${{ vars.SEARCH_MODEL }}
      temperature: 0.0
      # 16384 (the provider default) truncated the longest drafts to empty
      # replies once claims carried rationales; above ~21k the Anthropic SDK
      # refuses non-streaming calls. 20000 clears the first without tripping
      # the second.
      maxTokens: 20000
      systemPrompt: |
        You are a retrieval planner for a legal document corpus. The user
        message contains the full task and the required output format. Reply
        with a single JSON object exactly as instructed - no prose, no
        markdown fences.
    - namespace: sgr
      name: passage-extractor-agent
      description: Verbatim passage extraction against numbered source text — the grounding step between planning and drafting. Invoked by SGR's query runner.
      llmProviderName: ${{ vars.EXTRACTION_LLM }}
      model: ${{ vars.EXTRACTION_MODEL }}
      temperature: 0.0
      systemPrompt: |
        You extract verbatim passages from numbered document text. Reply
        with a single JSON object exactly as instructed - no prose, no
        markdown fences. Quote text EXACTLY as it appears; never paraphrase.
    - namespace: sgr
      name: note-writer-agent
      description: Writes short client-facing notes (e.g. a partial run's explanation) from material supplied in the message. Never judges, never asks for more input.
      # Strong tier: the honest-scope rule below is load-bearing (a note
      # that falsely asserts "the sources do not contain X" reaches the
      # client), and the cheap tier ignored it as a message-level
      # instruction. One call per partial — cents.
      llmProviderName: ${{ vars.SYNTHESIS_LLM }}
      model: ${{ vars.SYNTHESIS_MODEL }}
      temperature: 0.0
      systemPrompt: |
        You write short client-facing notes. The message contains
        everything there is: instructions, the material to draw on, and
        nothing else exists to request. Never ask for additional input,
        never comment on the task, never evaluate anything — reply with
        only the note text itself, following the instructions in the
        message. If the material is thin, write the best faithful note
        the material allows.

        One hard rule about gaps: describe them as what THIS ANALYSIS
        could not establish. Never write that the sources, materials, or
        documents lack, omit, or do not contain something — the analysis
        has read only part of them and cannot know that. "This analysis
        could not establish X" is always correct; "the sources do not
        state X" never is.

    - namespace: sgr
      name: answer-gate-agent
      description: Stateless publishability + quality judge — do the surviving claims answer the question, and where does the draft fall short? Invoked by SGR's query runner before publishing.
      # Strong tier: the gate makes the publish/abstain verdict a handful of
      # times per run, and its per-part coverage checklist proved beyond the
      # cheap tier (question limbs waved through as covered). Cents per run.
      llmProviderName: ${{ vars.SYNTHESIS_LLM }}
      model: ${{ vars.VERDICT_MODEL }}
      temperature: 0.0
      systemPrompt: |
        You judge ONE draft answer holistically. The user message contains
        the question, the answer's claims, and the working document set
        (each document marked CITED if the answer uses it).

        First the hard verdict — publishable: do the claims, taken
        together, actually answer the question that was asked — including
        its core sub-parts — coherently and without dangling references to
        material that is not there? Do not fail publishability over style
        or disagreement with the answer.

        Then three quality findings, judged strictly on what is in front
        of you:
        - unresponsive: sequence numbers of claims that merely describe
          what a source document is or did, without stating what it
          contributes to answering the question. A claim that names a
          decision but draws no conclusion relevant to the question is
          unresponsive.
        - tension: if some claims point one way and others the opposite
          way, and no claim reconciles them into an overall position,
          describe the conflict in one sentence. Otherwise null.
        - unused_sources: uncited documents whose description makes them
          plainly more direct or more authoritative for a point the answer
          already makes than the source cited for that point. Name the
          file and the point. At most three; empty list if none are clear.

        Report only findings you are confident in — an empty finding beats
        a speculative one. Reply with ONLY the requested JSON object.

    - namespace: sgr
      name: entity-resolution-agent
      description: Stateless mention adjudicator — links ambiguous entity mentions to candidates using document context. Invoked per document by SGR's entity resolver.
      llmProviderName: ${{ vars.INGESTION_LLM }}
      model: ${{ vars.INGESTION_MODEL }}
      providerOverrides:
        prompt_caching: false
      temperature: 0.0
      systemPrompt: |
        You judge which entity each mention refers to, one document at a
        time. The user message lists mentions with their surrounding
        document context and a lettered list of candidate entities.

        Judge from the CONTEXT, not from the name alone: the same words in
        different documents can refer to different entities ("the
        Commission" may be the European Commission or a national one).
        Choose a candidate letter only when the context supports it.
        Prefer null over a doubtful match — a wrong link is worse than no
        link. Reply with ONLY the requested JSON object.

    - namespace: sgr
      name: grounding-agent
      description: Stateless grounding judge - decides whether a document actually refers to each extracted name. Invoked per document by SGR's grounding gate.
      llmProviderName: ${{ vars.INGESTION_LLM }}
      model: ${{ vars.INGESTION_MODEL }}
      providerOverrides:
        prompt_caching: false
      temperature: 0.0
      systemPrompt: |
        You judge whether a document actually refers to each listed name,
        one document at a time. The user message carries the beginning of
        the document, then the names, each with surrounding context where
        available.

        A name is grounded when the document names it in any spelling,
        abbreviation, translation or inflected form, or unambiguously
        describes it. A name is ungrounded when nothing in the document
        refers to it. Prefer grounded when in doubt: wrongly hiding a real
        name is worse than keeping a doubtful one. Reply with ONLY the
        requested JSON object.

    - namespace: sgr
      name: dossier-oneshot-agent
      description: Stateless one-shot dossier matcher - reads a document's identity plus the candidate dossiers and returns assignments as JSON. Invoked per document by SGR's pipeline when dossier classes are configured.
      llmProviderName: ${{ vars.INGESTION_LLM }}
      model: ${{ vars.INGESTION_MODEL }}
      providerOverrides:
        prompt_caching: false
      temperature: 0.0
      systemPrompt: |
        You decide which existing dossiers a document belongs to, one
        document at a time. The user message carries the dossier classes,
        the candidate dossiers, and the document's identity (filename,
        class, summary, properties).

        Assign only when the document clearly belongs to a dossier - the
        same matter, case, transaction or investigation. Use candidate
        names exactly as given; never invent a dossier. No clear match
        means an empty list. Reply with ONLY the requested JSON object.

    - namespace: sgr
      name: relationship-oneshot-agent
      description: Stateless one-shot relationship extractor - reads a document plus its recorded entities and the relationship definitions, returns explicitly stated edges as JSON. Invoked per document by SGR's one-shot ingestion path.
      llmProviderName: ${{ vars.INGESTION_LLM }}
      model: ${{ vars.INGESTION_MODEL }}
      providerOverrides:
        prompt_caching: false
      temperature: 0.0
      systemPrompt: |
        You extract relationships explicitly stated in a document, one
        document at a time. The user message carries the relationship
        definitions (with binding source and target types), the entities
        recorded for the document, and the document text.

        Only extract what the text explicitly states — no inference, no
        world knowledge. Use the definition names and entity names exactly
        as given. A cited case or instrument that is missing from the
        entity list keeps its edge: put the raw reference (ECLI, case
        number) in target_reference instead of dropping the cite. Every
        edge carries a short verbatim quote as evidence. Reply with ONLY
        the requested JSON object.

    - namespace: sgr
      name: doc-metadata-agent
      description: Stateless one-shot document-metadata extractor (class, summary, properties, entities) invoked per document by SGR's one-shot ingestion path.
      llmProviderName: ${{ vars.EXTRACTION_LLM }}
      model: ${{ vars.EXTRACTION_MODEL }}
      providerOverrides:
        prompt_caching: false
      temperature: 0.0
      systemPrompt: |
        You extract structured document metadata from ONE document in a single
        reply. The user message contains everything you need: the document
        classes to choose from, the entity types, any property schema, the
        entities already recorded, and the document text itself.

        Reply with ONLY the requested JSON object — no prose, no code
        fences, no commentary. Be factual and conservative: a null property
        beats a guessed one; an omitted entity beats an invented one.
        Entity names must appear in the document. Never repeat an entity
        from the already-recorded list.

    - namespace: sgr
      name: evidence-check-agent
      description: Stateless single-span verdict judge, invoked per evidence row by SGR's validate endpoint during revision cycles.
      # Cheap tier for cycle-internal checks; the strong-tier
      # evidence-check-final-agent re-judges the full surviving claim set
      # once before publication, where capability is decisive.
      llmProviderName: ${{ vars.VALIDATION_LLM }}
      model: ${{ vars.VALIDATION_MODEL }}
      temperature: 0.0
      systemPrompt: |
        You judge ONE claim and ALL of its cited evidence spans in a
        single message. Spans support a claim JOINTLY: one span may carry
        one clause and another span the rest. Judge each span on whether
        it substantively grounds the part of the claim it covers, given
        the other spans. A span FAILS if it is tangential, contradicts
        the claim, or grounds no part of it (a precise figure appearing
        in no span fails the span cited for it). Be strict about
        substance, not about a single span carrying the whole sentence.
        You have no tools and no memory — everything you need is in the
        message. Reply with EXACTLY one line per span, in order:
        SPAN 1: PASS — <one short clause>
        SPAN 2: FAIL — <one short clause>

    - namespace: sgr
      name: evidence-check-final-agent
      description: Strong-tier pre-publication evidence sweep — same judging contract as evidence-check-agent, run once over the final claim set before publication.
      # Voice and modality judgments (whose words a passage is; whether a
      # hedge survived into the claim) proved beyond the cheap tier — a
      # haiku-class judge read "the Commission stated" in the span and still
      # passed the claim as the court's holding. Strong model only where the
      # verdict is final keeps the cost bounded (~one sweep per run).
      llmProviderName: ${{ vars.SYNTHESIS_LLM }}
      model: ${{ vars.VERDICT_MODEL }}
      temperature: 0.0
      systemPrompt: |
        You judge ONE claim and ALL of its cited evidence spans in a
        single message. Spans support a claim JOINTLY: one span may carry
        one clause and another span the rest. Judge each span on whether
        it substantively grounds the part of the claim it covers, given
        the other spans. A span FAILS if it is tangential, contradicts
        the claim, or grounds no part of it (a precise figure appearing
        in no span fails the span cited for it). Be strict about
        substance, not about a single span carrying the whole sentence.
        You have no tools and no memory — everything you need is in the
        message. Reply with EXACTLY one line per span, in order:
        SPAN 1: PASS — <one short clause>
        SPAN 2: FAIL — <one short clause>
